# Nginx reverse proxy — Platinum Tier AI Employee (cloud VM)
#
# Routes HTTPS traffic to the PM2 web dashboard (port 9615).
# Obtains TLS certificates via Certbot (Let's Encrypt).
#
# Prerequisites (handled by setup-vm.sh):
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d <YOUR_DOMAIN>
#
# To install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ai-employee
#   sudo ln -sf /etc/nginx/sites-available/ai-employee \
#               /etc/nginx/sites-enabled/ai-employee
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    server_name _;   # replace with your domain after certbot provisioning

    # Certbot ACME challenge — must remain on port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # All other traffic → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — main server block ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name _;   # replace with your domain after certbot provisioning

    # ── TLS — managed by Certbot (do not edit manually) ──────────────────────
    # ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Harden TLS (modern config).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "no-referrer"   always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/ai-employee-access.log combined;
    error_log  /var/log/nginx/ai-employee-error.log  warn;

    # ── Proxy to PM2 web dashboard (port 9615) ────────────────────────────────
    location /dashboard/ {
        proxy_pass         http://127.0.0.1:9615/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;

        # Basic auth — protect the PM2 dashboard from public access.
        # Generate: sudo htpasswd -c /etc/nginx/.htpasswd admin
        auth_basic           "AI Employee Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # ── Health endpoint (no auth — for load-balancer probes) ─────────────────
    location /health {
        proxy_pass         http://127.0.0.1:9615/status;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        # Allow only private CIDRs + localhost.
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    # ── Block access to hidden files ──────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
