[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee"
version = "1.0.0"
description = "Local-first autonomous AI Employee System"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
silver = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "schedule>=1.2",
    "google-genai>=1.0",
]
gold = [
    "jinja2>=3.1",
    "tweepy>=4.0",
]
platinum = [
    "cryptography>=42.0",
    "paramiko>=3.0",
    "psutil>=5.9",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
