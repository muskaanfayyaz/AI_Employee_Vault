# CEO Briefing Skill Configuration
# Implements FR-G016: weekly executive briefing on configurable schedule.
#
# The briefing is generated by the generate_ceo_briefing Agent Skill.
# To trigger manually: invoke the skill with item_path=None.
# For scheduled runs, configure the cron orchestrator to call this skill
# at schedule.day / schedule.hour (local time).

skill:
  name: "generate_ceo_briefing"
  version: "1.0.0"
  enabled: true

schedule:
  # Day of week (0=Monday … 6=Sunday). Default: 0 (Monday).
  day: 0
  # Hour in 24h local time. Default: 8 (08:00).
  hour: 8
  # Minute. Default: 0.
  minute: 0

briefing:
  # Number of days to look back for Done tasks and log analysis.
  period_days: 7

  # Currency label used in the revenue summary section.
  currency: "USD"

  # Vault sub-directory where briefings are written.
  # Must be relative to vault root.
  report_dir: "Reports"

  # Maximum Done tasks to list individually (remainder shown as "…N more").
  max_done_list: 20

  # Maximum pending-approval items to list individually.
  max_approval_list: 10

inputs:
  # Path to the business goals file, relative to vault root.
  # Create this file to give the briefing skill strategic context.
  business_goals_file: "Business_Goals.md"

  # Directory containing accounting markdown summaries (relative to vault root).
  # Create .md files here with invoice and payment data for revenue tracking.
  accounting_dir: "Accounting"

  # Vault folders scanned for task pipeline data.
  pipeline_folders:
    - "Done"
    - "Needs_Action"
    - "In_Progress"
    - "Pending_Approval"
    - "Errors"

  # Log directory for audit log scanning and Ralph Wiggum insights.
  logs_dir: "Logs"

# Delivery: if email_on_completion is true, the completed briefing is
# routed through the standard approval workflow before being sent via the
# email MCP server (FR-G017 — the CEO receives nothing without approval).
delivery:
  email_on_completion: false
  # Email recipient (used if email_on_completion: true).
  recipient: ""
  email_subject_prefix: "Weekly CEO Briefing"
