# Instagram Social Platform Configuration — AI Employee Gold Tier
# FR-G012: Instagram is an independently configurable integration.
# FR-G041: Credentials stored ONLY in .env — only env var names referenced here.
#
# Note: Instagram posting requires a Facebook Business account and a
# connected Instagram Professional account. Uses the Instagram Graph API
# via the Facebook Graph API endpoint.
#
# Set enabled: true and configure env vars before activating.

social:
  platform: "instagram"
  enabled: true                   # Set true when credentials are configured

  # Environment variable names for credentials (FR-G041)
  credential_refs:
    access_token: "INSTAGRAM_ACCESS_TOKEN"      # Facebook access token with Instagram scope
    instagram_account_id: "INSTAGRAM_ACCOUNT_ID"  # Instagram Business Account ID

  # Post constraints (FR-G014)
  max_chars: 2200
  max_hashtags: 30
  tone: "visual"

  # API settings
  api_version: "v19.0"              # Facebook/Instagram Graph API version
